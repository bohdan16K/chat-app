<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real-Time Chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-container">

  <!-- 1. Авторизація -->
  <form class="auth-box" id="authForm" novalidate>
    <h2>Вхід у чат</h2>

    <div class="form-group">
      <label for="authUsername">Логін</label>
      <input type="text" id="authUsername" placeholder="Введіть логін" autocomplete="username" maxlength="20" required>
    </div>

    <div class="form-group">
      <label for="authPassword">Пароль</label>
      <input type="password" id="authPassword" placeholder="Введіть пароль" autocomplete="current-password" maxlength="72" required>
    </div>

    <p class="auth-error hidden" id="authError" role="alert"></p>

    <label class="checkbox-group">
      <input type="checkbox" id="rememberMe"> Запам'ятати мене
    </label>

    <div class="auth-buttons">
      <button type="submit" class="btn" id="loginBtn">Увійти</button>
      <button type="button" class="btn btn-secondary" id="registerBtn">Реєстрація</button>
    </div>
  </form>

  <!-- 2. Чат із сайдбаром -->
  <div class="chat-app hidden" id="chatContainer">
    <aside class="sidebar">
      <div class="sidebar-header">
        <span>Вітаємо, <strong id="userDisplay"></strong>!</span>
        <button type="button" class="logout-btn" id="logoutBtn">Вийти</button>
      </div>

      <div class="users-section">
        <h4>Чати</h4>
        <div class="user-item active" id="generalChatBtn" role="button" tabindex="0">
          <span class="status-dot online"></span>
          <span>📢 Загальний чат</span>
          <span class="unread-badge hidden" id="badge-general">0</span>
        </div>

        <h4>Користувачі</h4>
        <div id="usersList" class="users-list"></div>
      </div>
    </aside>

    <main class="chat-window">
      <header class="chat-header">
        <button type="button" class="back-btn" id="backBtn">← Чати</button>
        <h3 id="chatTitle">📢 Загальний чат</h3>
      </header>

      <div class="chat-messages" id="messages"></div>
      <div id="typingIndicator" class="typing-indicator hidden"></div>

      <form class="chat-form" id="chatForm">
        <input type="text" id="messageInput" placeholder="Введіть повідомлення..." maxlength="2000" required autocomplete="off">
        <button type="submit">Надіслати</button>
      </form>
    </main>
  </div>

</div>

<div class="toast hidden" id="toast" role="status"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>

</body>
</html>
